name: Intégration continue

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Compilation Windows
    runs-on: windows-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v6

      - name: Installation du SDK .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Installation du workload MAUI
        run: dotnet workload install maui

      - name: Compilation
        run: dotnet build SuiviCandidatures.Presentation/SuiviCandidatures.Presentation.csproj -c Release -f net10.0-windows10.0.19041.0

      - name: Tests unitaires
        run: dotnet test --project SuiviCandidatures.Tests/SuiviCandidatures.Tests.csproj -c Release

  # Contrôle indicatif, à lancer à la main (onglet Actions, « Run workflow ») : la cible Mac Catalyst n'est pas
  # testée par l'auteur du projet. Le SDK .NET pour Mac Catalyst exige une version précise d'Xcode (27.1 au moment de
  # l'écriture) que les machines GitHub n'ont pas toujours : un échec est alors attendu et ne dit rien du code.
  maccatalyst:
    name: Compilation Mac Catalyst (manuelle, indicative)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    continue-on-error: true
    steps:
      - name: Récupération du code
        uses: actions/checkout@v6

      - name: Installation du SDK .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Sélection de la version d'Xcode la plus récente installée
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Xcode sélectionné : $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Installation du workload MAUI
        run: dotnet workload install maui

      - name: Compilation
        run: dotnet build SuiviCandidatures.Presentation/SuiviCandidatures.Presentation.csproj -c Release -f net10.0-maccatalyst
